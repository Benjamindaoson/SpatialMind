services:
  mission-control:
    build: .
    image: spatialmind:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPATIALMIND_DATA_DIR: /data
    volumes:
      - spatialmind-data:/data
    security_opt:
      - no-new-privileges:true
  physical-lab:
    image: spatialmind:local
    build: .
    init: true
    restart: unless-stopped
    command: ["uvicorn", "spatialmind.physical_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      SPATIALMIND_DATA_DIR: /data
      SPATIALMIND_HEALTH_PORT: "8001"
    volumes:
      - spatialmind-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  spatialmind-data:

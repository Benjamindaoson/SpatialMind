services:
  mission-control:
    build: .
    image: spatialmind:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPATIALMIND_DATA_DIR: /data
    volumes:
      - spatialmind-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  spatialmind-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialmind"
version = "0.2.0"
description = "Memory-grounded, measurable autonomous mobile robot agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SpatialMind contributors"}]
keywords = ["robotics", "ros2", "agent", "spatial-memory", "navigation"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
datasets = ["Pillow>=10,<13"]

[project.scripts]
spatialmind = "spatialmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spatialmind = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SpatialMind
        run: python -m pip install -e ".[api,dev]"
      - name: Compile all Python sources and ROS2 bridge code
        run: python -m compileall -q src tests scripts ros2_ws/src
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Demonstrate an evidenced task
        run: spatialmind demo --data-dir /tmp/spatialmind-ci --instruction "Find the blue toolbox"
      - name: Run intervention comparison
        run: spatialmind benchmark --seeds 3 --output /tmp/spatialmind-benchmark.json --trace-dir /tmp/spatialmind-traces
      - name: Generate aligned Gazebo world and semantic assets (static check only)
        run: python scripts/generate_gazebo_scene.py --out /tmp/spatialmind-gazebo-assets
      - name: Run metric physical-agent intervention comparisons
        run: spatialmind physical-benchmark --seeds 3 --output-dir /tmp/spatialmind-physical-benchmark --trace
      - name: Build non-root mission-control Docker image
        run: docker build --tag spatialmind-ci .
      - name: Smoke-test containerized API
        run: |
          docker run --detach --name spatialmind-ci --publish 127.0.0.1:8000:8000 spatialmind-ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/healthz
          docker rm --force spatialmind-ci
      - name: Smoke-test physical asynchronous API container
        run: |
          docker run --detach --name spatialmind-physical-ci \
            --env SPATIALMIND_HEALTH_PORT=8001 \
            --publish 127.0.0.1:8001:8001 \
            spatialmind-ci uvicorn spatialmind.physical_api:app --host 0.0.0.0 --port 8001
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8001/api/physical/state
          docker rm --force spatialmind-physical-ci
      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-benchmark
          path: |
            /tmp/spatialmind-benchmark.json
            /tmp/spatialmind-traces/
            /tmp/spatialmind-physical-benchmark/
            /tmp/spatialmind-gazebo-assets/
          if-no-files-found: ignore

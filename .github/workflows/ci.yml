name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SpatialMind
        run: python -m pip install -e ".[api,dev]"
      - name: Compile all Python sources
        run: python -m compileall -q src tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Demonstrate an evidenced task
        run: spatialmind demo --data-dir /tmp/spatialmind-ci --instruction "Find the blue toolbox"
      - name: Run intervention comparison
        run: spatialmind benchmark --output /tmp/spatialmind-benchmark.json
      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-benchmark
          path: /tmp/spatialmind-benchmark.json
          if-no-files-found: ignore
